name: SurvivalAdmin
version: 2.0.0
main: net.omegasmp.survivaladmin.SurvivalAdmin
api-version: '1.21'
author: Omega
description: Professional administration plugin for Survival servers with role-based access control
website: https://t.me/ItOmega

commands:
  staff:
    description: Give staff role
    usage: /staff <player>
    permission: survivaladmin.owner
  unstaff:
    description: Remove staff role
    usage: /unstaff <player>
    permission: survivaladmin.owner
  owner:
    description: Give owner role
    usage: /owner <player>
    permission: survivaladmin.owner
  unowner:
    description: Remove owner role
    usage: /unowner <player>
    permission: survivaladmin.owner
  admin:
    description: Admin panel
    usage: /admin
    permission: survivaladmin.staff
  help:
    description: SurvivalAdmin help
    usage: /help
    permission: survivaladmin.user
  tp:
    description: Teleport to player
    usage: /tp <player>
    permission: survivaladmin.staff
  gm:
    description: Change gamemode
    usage: /gm <0|1|2|3> [player]
    permission: survivaladmin.staff
  gamemode:
    description: Change gamemode
    usage: /gamemode <survival|creative|adventure|spectator> [player]
    permission: survivaladmin.staff
  time:
    description: Set time
    usage: /time <day|night|noon|midnight|number>
    permission: survivaladmin.staff
  weather:
    description: Set weather
    usage: /weather <clear|rain|thunder>
    permission: survivaladmin.staff
  invsee:
    description: View player inventory
    usage: /invsee <player>
    permission: survivaladmin.staff
  inv:
    description: View/edit player inventory
    usage: /inv <player>
    permission: survivaladmin.staff
  getoff:
    description: Ban player with time and reason
    usage: /getoff <player> <time> [reason]
    permission: survivaladmin.staff
  invis:
    description: Toggle invisibility
    usage: /invis
    permission: survivaladmin.staff
  vanish:
    description: Toggle invisibility
    usage: /vanish
    permission: survivaladmin.staff
  kick:
    description: Kick a player
    usage: /kick <player> [reason]
    permission: survivaladmin.staff
  mute:
    description: Mute a player
    usage: /mute <player> [time] [reason]
    permission: survivaladmin.staff
  unmute:
    description: Unmute a player
    usage: /unmute <player>
    permission: survivaladmin.staff
  freeze:
    description: Freeze a player
    usage: /freeze <player>
    permission: survivaladmin.staff
  unfreeze:
    description: Unfreeze a player
    usage: /unfreeze <player>
    permission: survivaladmin.staff
  clearchat:
    description: Clear chat
    usage: /clearchat
    permission: survivaladmin.staff
  cc:
    description: Clear chat (alias)
    usage: /cc
    permission: survivaladmin.staff
  broadcast:
    description: Broadcast a message
    usage: /broadcast <msg>
    permission: survivaladmin.staff
  bc:
    description: Broadcast a message (alias)
    usage: /bc <msg>
    permission: survivaladmin.staff
  warn:
    description: Warn a player
    usage: /warn <player> <reason>
    permission: survivaladmin.staff

permissions:
  survivaladmin.owner:
    description: Owner permissions
    default: op
  survivaladmin.staff:
    description: Staff permissions
    default: false
  survivaladmin.user:
    description: User permissions
    default: true
  survivaladmin.kick:
    description: Kick players
    default: false
  survivaladmin.ban:
    description: Ban players
    default: false
  survivaladmin.tempban:
    description: Temporarily ban players
    default: false
  survivaladmin.unban:
    description: Unban players
    default: false
  survivaladmin.mute:
    description: Mute players
    default: false
  survivaladmin.unmute:
    description: Unmute players
    default: false
  survivaladmin.tp:
    description: Teleport to players
    default: false
  survivaladmin.gamemode:
    description: Change gamemode
    default: false
  survivaladmin.time:
    description: Change time
    default: false
  survivaladmin.weather:
    description: Change weather
    default: false
  survivaladmin.invsee:
    description: View player inventory
    default: false
  survivaladmin.vanish:
    description: Toggle invisibility
    default: false
  survivaladmin.kick:
    description: Kick players
    default: false
  survivaladmin.mute:
    description: Mute players
    default: false
  survivaladmin.unmute:
    description: Unmute players
    default: false
  survivaladmin.freeze:
    description: Freeze players
    default: false
  survivaladmin.clearchat:
    description: Clear chat
    default: false
  survivaladmin.broadcast:
    description: Broadcast messages
    default: false
  survivaladmin.warn:
    description: Warn players
    default: false